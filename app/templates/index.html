<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mario 帮你挑导师 — 广州大学机械与电气工程学院</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="app-container">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-robot"></i>
            </div>
            <h2>Mario 帮你挑导师</h2>
            <p class="subtitle">广州大学 · 机械与电气工程学院</p>
        </div>
        <div class="sidebar-info">
            <div class="info-card">
                <i class="fas fa-lightbulb"></i>
                <span>告诉我你的兴趣方向</span>
            </div>
            <div class="info-card">
                <i class="fas fa-bullseye"></i>
                <span>设定你的学业/职业目标</span>
            </div>
            <div class="info-card">
                <i class="fas fa-user-graduate"></i>
                <span>获取匹配导师推荐</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="tip-card">
                <i class="fas fa-comment-dots"></i>
                <div class="tip-text">
                    <strong>试试这样说：</strong>
                    <p>"我喜欢机器人"</p>
                    <p>"我想就业"</p>
                    <p>"查看我的画像"</p>
                    <p>"推荐导师"</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- 右侧主聊天区 -->
    <main class="main-content">
        <div class="chat-header">
            <div class="header-left">
                <div class="mario-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <span>Mario</span>
            </div>
            <div class="header-right">
                <!-- 查看画像按钮 -->
                <div class="profile-badge" id="profileBadge" onclick="toggleProfile()">
                    <i class="fas fa-id-card"></i>
                    <span>查看画像</span>
                    <i class="fas fa-chevron-down badge-arrow"></i>
                </div>
                <!-- 画像浮窗 -->
                <div class="profile-popup" id="profilePopup">
                    <div class="profile-popup-header">
                        <i class="fas fa-id-card"></i>
                        <span>我的画像</span>
                        <button class="profile-popup-close" onclick="toggleProfile()">&times;</button>
                    </div>
                    <div class="profile-popup-body" id="profilePopupBody">
                        <div class="profile-loading">点击下方按钮查看画像</div>
                    </div>
                    <div class="profile-popup-footer">
                        <button class="profile-btn profile-btn-view" onclick="viewProfile()">
                            <i class="fas fa-sync-alt"></i> 刷新画像
                        </button>
                        <button class="profile-btn profile-btn-reset" onclick="resetProfile()">
                            <i class="fas fa-trash-alt"></i> 重置画像
                        </button>
                    </div>
                </div>
                <!-- 遮罩层 -->
                <div class="profile-overlay" id="profileOverlay" onclick="toggleProfile()"></div>

                <!-- 推荐导师浮窗 -->
                <div class="recommend-overlay" id="recommendOverlay" onclick="closeRecommend()"></div>
                <div class="recommend-popup" id="recommendPopup">
                    <div class="recommend-popup-header">
                        <i class="fas fa-graduation-cap"></i>
                        <span>推荐导师</span>
                        <button class="recommend-popup-close" onclick="closeRecommend()">&times;</button>
                    </div>
                    <div class="recommend-popup-body" id="recommendPopupBody">
                        <div class="recommend-loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
                    </div>
                    <div class="recommend-popup-footer">
                        <button class="recommend-btn recommend-btn-secondary" onclick="quickFillAndSend('换一批')" style="flex:1;padding:10px 20px;border-radius:10px;font-size:14px;">
                            <i class="fas fa-sync-alt"></i> 换一批
                        </button>
                    </div>
                </div>

                <span class="status-dot"></span>
                <span class="status-text">在线</span>
                <span class="user-badge" id="userBadge" style="display:none;margin-left:12px;padding:4px 10px;background:rgba(255,255,255,0.08);border-radius:8px;font-size:13px;color:#94a3b8;">
                    <i class="fas fa-user"></i>
                    <span id="usernameDisplay"></span>
                    <a href="javascript:logout()" style="color:#ef4444;margin-left:8px;text-decoration:none;" title="退出登录">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </span>
            </div>
        </div>

        <div id="chat-box" class="chat-box">
            <!-- 消息会由 JavaScript 动态添加 -->
        </div>

        <div class="input-area">
            <div class="recommend-bar">
                <button class="recommend-btn" onclick="quickFillAndSend('推荐导师')">
                    <i class="fas fa-graduation-cap"></i>
                    <span>推荐导师</span>
                </button>
            </div>
            <div class="input-wrapper">
                <textarea id="message" placeholder="说说你的想法，比如：我喜欢机器人..." rows="1"></textarea>
                <button id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-tips">
                <span class="tip" onclick="quickFill('我不知道喜欢什么')">探索方向</span>
                <span class="tip" onclick="quickFill('查看我的画像')">查看画像</span>
            </div>
        </div>
    </main>
</div>

<script>
// ============================================================
// 用户认证
// ============================================================

function getAuthToken() {
    return localStorage.getItem("gzhu_auth_token");
}

function getUsername() {
    return localStorage.getItem("gzhu_username") || "";
}

function getUserId() {
    const token = getAuthToken();
    if (token) {
        const username = getUsername();
        if (username) return `user_${username}`;
    }
    let userId = localStorage.getItem("gzhu_user_session_id");
    if (!userId) {
        userId = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
        localStorage.setItem("gzhu_user_session_id", userId);
    }
    return userId;
}

function checkAuth() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get("token");
    if (urlToken) {
        localStorage.setItem("gzhu_auth_token", urlToken);
        window.history.replaceState({}, "", "/");
    }
    const token = getAuthToken();
    if (!token) {
        window.location.href = "/login";
        return false;
    }
    const username = getUsername();
    const badge = document.getElementById("userBadge");
    const display = document.getElementById("usernameDisplay");
    if (username && badge) {
        badge.style.display = "inline-flex";
        display.textContent = username;
    }
    return true;
}

function logout() {
    const token = getAuthToken();
    if (token) {
        fetch("/api/logout", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({token})
        }).catch(() => {});
    }
    localStorage.removeItem("gzhu_auth_token");
    localStorage.removeItem("gzhu_username");
    window.location.href = "/login";
}

window.onload = async function() {
    if (!checkAuth()) return;
    try {
        let response = await fetch("/welcome", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({session_id: getUserId()})
        });
        let data = await response.json();
        addBotMessage(data.reply);
    } catch (e) {
        addBotMessage("你好呀，我是 Mario！欢迎来到广州大学机械与电气工程学院导师推荐系统。告诉我你的兴趣方向，我来帮你挑最合适的导师。");
    }
};

// ============================================================
// 画像浮窗
// ============================================================
function toggleProfile() {
    document.getElementById("profileBadge").classList.toggle("active");
    document.getElementById("profilePopup").classList.toggle("show");
    document.getElementById("profileOverlay").classList.toggle("show");
}

async function viewProfile() {
    let body = document.getElementById("profilePopupBody");
    body.innerHTML = '<div class="profile-loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>';
    try {
        let response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: "查看我的画像",
                session_id: getUserId()
            })
        });
        let data = await response.json();
        let text = data.reply.replace(/\n/g, '<br>');
        body.innerHTML = `<div class="profile-content">${text}</div>`;
    } catch (e) {
        body.innerHTML = '<div class="profile-loading">加载失败，请重试</div>';
    }
}

async function resetProfile() {
    if (!confirm("确定要清空所有画像信息吗？")) return;
    let body = document.getElementById("profilePopupBody");
    body.innerHTML = '<div class="profile-loading"><i class="fas fa-spinner fa-spin"></i> 重置中...</div>';
    try {
        let response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: "重置我的画像",
                session_id: getUserId()
            })
        });
        let data = await response.json();
        body.innerHTML = `<div class="profile-content">${data.reply}</div>`;
    } catch (e) {
        body.innerHTML = '<div class="profile-loading">重置失败，请重试</div>';
    }
}

// ============================================================
// 推荐导师浮窗
// ============================================================
function openRecommend(teachers) {
    document.getElementById("recommendPopup").classList.add("show");
    document.getElementById("recommendOverlay").classList.add("show");
    renderTeacherCards(teachers);
}

function closeRecommend() {
    document.getElementById("recommendPopup").classList.remove("show");
    document.getElementById("recommendOverlay").classList.remove("show");
}

function renderTeacherCards(teachers) {
    let body = document.getElementById("recommendPopupBody");
    if (!teachers || teachers.length === 0) {
        body.innerHTML = '<div class="recommend-loading">暂无匹配导师，请先告诉我您的兴趣方向。</div>';
        return;
    }
    let html = '<div class="teacher-grid">';
    teachers.forEach(function(t, idx) {
        let research = Array.isArray(t.research) ? t.research.join('、') : (t.research || '暂无');
        let courses = Array.isArray(t.courses) ? t.courses.join('、') : (t.courses || '暂无');
        let email = t.email || '';
        let homepage = t.homepage || '';
        let score = t.score || '';
        html += `
            <div class="teacher-card-bubble">
                <div class="tcb-header">
                    <div class="tcb-avatar">${t.name.charAt(0)}</div>
                    <div class="tcb-name-row">
                        <span class="tcb-name">${escapeHtml(t.name)}</span>
                        ${score ? `<span class="tcb-score">${escapeHtml(score)}</span>` : ''}
                    </div>
                </div>
                <div class="tcb-body">
                    <div class="tcb-field">
                        <span class="tcb-label">研究方向</span>
                        <span class="tcb-value">${escapeHtml(research)}</span>
                    </div>
                    <div class="tcb-field">
                        <span class="tcb-label">课程</span>
                        <span class="tcb-value">${escapeHtml(courses)}</span>
                    </div>
                    ${email ? `<div class="tcb-field">
                        <span class="tcb-label">邮箱</span>
                        <span class="tcb-value tcb-email">${escapeHtml(email)}</span>
                    </div>` : ''}
                    ${homepage ? `<div class="tcb-field">
                        <span class="tcb-label">主页</span>
                        <span class="tcb-value tcb-link"><a href="${escapeHtml(homepage)}" target="_blank" rel="noopener">查看主页 <i class="fas fa-external-link-alt"></i></a></span>
                    </div>` : ''}
                </div>
            </div>
        `;
    });
    html += '</div>';
    body.innerHTML = html;
}

// ============================================================
// 聊天功能
// ============================================================

function quickFillAndSend(text) {
    document.getElementById("message").value = text;
    sendMessage();
}

function addUserMessage(text) {
    let box = document.getElementById("chat-box");
    let time = new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"});
    box.innerHTML += `
        <div class="message user">
            <div class="message-content">
                <div class="bubble">${escapeHtml(text)}</div>
            </div>
            <div class="message-meta">
                <span class="time">${time}</span>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>`;
    box.scrollTop = box.scrollHeight;
}

function showLoading() {
    let box = document.getElementById("chat-box");
    let msgId = "loading-" + Date.now();
    box.innerHTML += `
        <div class="message bot" id="${msgId}">
            <div class="message-meta">
                <i class="fas fa-robot"></i>
                <span class="time">${new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"})}</span>
            </div>
            <div class="message-content">
                <div class="bubble loading-bubble">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </div>`;
    box.scrollTop = box.scrollHeight;
    return msgId;
}

function hideLoading(loadingId) {
    let el = document.getElementById(loadingId);
    if (el) el.remove();
}

function quickFill(text) {
    document.getElementById("message").value = text;
    autoResize(document.getElementById("message"));
    document.getElementById("message").focus();
}

function autoResize(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// 发送消息
// ============================================================
let isSending = false;

async function sendMessage() {
    let input = document.getElementById("message");
    let text = input.value.trim();
    if (!text || isSending) return;

    isSending = true;
    let btn = document.getElementById("sendBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    addUserMessage(text);
    input.value = "";
    autoResize(input);

    let loadingId = showLoading();

    try {
        let response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: text,
                session_id: getUserId()
            })
        });
        let data = await response.json();

        hideLoading(loadingId);

        // 检查是否有导师推荐数据
        if (data.teachers && Array.isArray(data.teachers) && data.teachers.length > 0) {
            // 有导师推荐数据，弹出浮窗
            addBotMessage("为您找到以下匹配导师：");
            openRecommend(data.teachers);
        } else {
            // 普通回复，打字机效果
            addBotMessageWithTyping(data.reply);
        }
    } catch (e) {
        hideLoading(loadingId);
        addBotMessage("抱歉，我遇到了一些问题，请稍后再试。");
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
        isSending = false;
    }
}

function addBotMessage(text) {
    let box = document.getElementById("chat-box");
    let time = new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"});
    let msgId = "msg-" + Date.now();
    box.innerHTML += `
        <div class="message bot" id="${msgId}">
            <div class="message-meta">
                <i class="fas fa-robot"></i>
                <span class="time">${time}</span>
            </div>
            <div class="message-content">
                <div class="bubble">${text}</div>
            </div>
        </div>`;
    box.scrollTop = box.scrollHeight;
}

function addBotMessageWithTyping(text) {
    let box = document.getElementById("chat-box");
    let time = new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"});
    let msgId = "msg-" + Date.now();
    box.innerHTML += `
        <div class="message bot" id="${msgId}">
            <div class="message-meta">
                <i class="fas fa-robot"></i>
                <span class="time">${time}</span>
            </div>
            <div class="message-content">
                <div class="bubble typing-bubble" id="${msgId}-text"></div>
            </div>
        </div>`;
    box.scrollTop = box.scrollHeight;

    let displayHtml = text.replace(/\n/g, '<br>');
    let container = document.getElementById(msgId + "-text");

    let tokens = [];
    let i = 0;
    while (i < displayHtml.length) {
        if (displayHtml[i] === '<') {
            let end = displayHtml.indexOf('>', i);
            if (end !== -1) {
                tokens.push(displayHtml.substring(i, end + 1));
                i = end + 1;
            } else {
                tokens.push(displayHtml[i]);
                i++;
            }
        } else {
            tokens.push(displayHtml[i]);
            i++;
        }
    }

    let index = 0;
    let userScrolledUp = false;

    box.addEventListener('scroll', function() {
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;
        userScrolledUp = !atBottom;
    });

    function typeChar() {
        if (index < tokens.length) {
            container.innerHTML += tokens[index];
            index++;
            if (!userScrolledUp) {
                box.scrollTop = box.scrollHeight;
            }
            let delay = 15;
            if (tokens[index] && tokens[index].startsWith('<')) delay = 1;
            setTimeout(typeChar, delay);
        } else {
            container.classList.remove("typing-bubble");
        }
    }
    typeChar();
}

document.getElementById("message").addEventListener("input", function() {
    autoResize(this);
});

document.getElementById("message").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>
</body>
</html>
