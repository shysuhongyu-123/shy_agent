services:
  - type: web
    name: shy-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --max-requests 1
    autoDeploy: true
    branch: master
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false